<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>ComfyUI Cluster</title>
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("cc-theme"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  :root {
    color-scheme: light dark;
    --font: Roboto, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --primary: #6750A4;
    --primary-container: #EADDFF;
    --on-primary-container: #21005D;
    --secondary-container: #E8DEF8;
    --tertiary-container: #FFD8E4;
    --surface: #FEF7FF;
    --on-surface: #1D1B20;
    --on-surface-variant: #49454F;
    --frame: #F3EDF7;
    --frame-high: #ECE6F0;
    --outline-variant: #CAC4D0;
    --grid-dot: #CAC4D0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #D0BCFF;
      --primary-container: #4F378B;
      --on-primary-container: #EADDFF;
      --secondary-container: #4A4458;
      --tertiary-container: #633B48;
      --surface: #141218;
      --on-surface: #E6E0E9;
      --on-surface-variant: #CAC4D0;
      --frame: #1D1B20;
      --frame-high: #2B2930;
      --outline-variant: #49454F;
      --grid-dot: #36343B;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --primary: #D0BCFF;
    --primary-container: #4F378B;
    --on-primary-container: #EADDFF;
    --secondary-container: #4A4458;
    --tertiary-container: #633B48;
    --surface: #141218;
    --on-surface: #E6E0E9;
    --on-surface-variant: #CAC4D0;
    --frame: #1D1B20;
    --frame-high: #2B2930;
    --outline-variant: #49454F;
    --grid-dot: #36343B;
  }
  :root[data-theme="light"] { color-scheme: light; }

  *{box-sizing:border-box;}
  html{height:100%;scroll-padding-top:env(safe-area-inset-top, 0px);}
  body{
    height:100%;margin:0;display:flex;flex-direction:column;
    background:var(--surface);color:var(--on-surface);
    font-family:var(--font);-webkit-font-smoothing:antialiased;
  }

  header{
    flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:20px 24px 12px;
  }
  h1{margin:0;font:400 28px/36px var(--font);color:var(--primary);}
  .toggle{
    width:40px;height:40px;border:0;border-radius:50%;cursor:pointer;flex:none;
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--frame-high);color:var(--on-surface-variant);
    transition:filter .15s;
  }
  .toggle:hover{filter:brightness(1.08);}
  .toggle:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
  .toggle svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .toggle .sun{display:none;}
  :root[data-theme="dark"] .toggle .sun{display:block;}
  :root[data-theme="dark"] .toggle .moon{display:none;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .toggle .sun{display:block;}
    :root:not([data-theme="light"]) .toggle .moon{display:none;}
  }

  main{flex:1;min-height:0;padding:0 24px 24px;}
  .frame{
    position:relative;width:100%;height:100%;overflow:hidden;
    border-radius:28px;background:var(--frame);
    box-shadow:inset 0 0 0 1px var(--outline-variant);
  }
  .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--frame);}

  /* placeholder shown until the ComfyUI URL is set */
  .placeholder{
    position:absolute;inset:0;
    background-image:radial-gradient(var(--grid-dot) 1.2px, transparent 1.2px);
    background-size:24px 24px;
  }
  .placeholder svg{position:absolute;inset:0;width:100%;height:100%;}
  .placeholder .node{fill:var(--frame-high);stroke:var(--outline-variant);stroke-width:1.5;}
  .placeholder .head-a{fill:var(--primary-container);}
  .placeholder .head-b{fill:var(--secondary-container);}
  .placeholder .head-c{fill:var(--tertiary-container);}
  .placeholder .line{fill:var(--outline-variant);}
  .placeholder .wire{fill:none;stroke:var(--primary);stroke-width:2;opacity:.55;}
  .placeholder .pin{fill:var(--primary);}
  .badge{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    padding:10px 18px;border-radius:20px;white-space:nowrap;
    background:var(--primary-container);color:var(--on-primary-container);
    font:500 14px/20px var(--font);letter-spacing:.1px;
  }

  @media (max-width:600px){
    header{padding:16px 16px 8px;}
    h1{font-size:24px;line-height:32px;}
    main{padding:0 12px 12px;}
    .frame{border-radius:24px;}
  }
</style>
</head>
<body>
  <header>
    <h1>ComfyUI Cluster</h1>
    <button class="toggle" id="theme" type="button" aria-label="Toggle light and dark theme">
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main>
    <div class="frame" id="frame">
      <div class="placeholder" id="placeholder" aria-hidden="true">
        <svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">
          <path class="wire" d="M330 190 C400 190 400 330 470 330"/>
          <path class="wire" d="M330 250 C420 250 420 480 520 480"/>
          <path class="wire" d="M740 330 C800 330 800 260 860 260"/>
          <path class="wire" d="M740 480 C800 480 800 300 860 300"/>
          <g>
            <rect class="node" x="130" y="150" width="200" height="150" rx="14"/>
            <path class="head-a" d="M130 164a14 14 0 0 1 14-14h172a14 14 0 0 1 14 14v22H130z"/>
            <rect class="line" x="148" y="206" width="120" height="8" rx="4"/>
            <rect class="line" x="148" y="230" width="150" height="8" rx="4"/>
            <circle class="pin" cx="330" cy="190" r="5"/><circle class="pin" cx="330" cy="250" r="5"/>
          </g>
          <g>
            <rect class="node" x="470" y="290" width="270" height="130" rx="14"/>
            <path class="head-b" d="M470 304a14 14 0 0 1 14-14h242a14 14 0 0 1 14 14v22H470z"/>
            <rect class="line" x="490" y="346" width="180" height="8" rx="4"/>
            <rect class="line" x="490" y="370" width="130" height="8" rx="4"/>
            <circle class="pin" cx="740" cy="330" r="5"/>
          </g>
          <g>
            <rect class="node" x="520" y="450" width="220" height="130" rx="14"/>
            <path class="head-c" d="M520 464a14 14 0 0 1 14-14h192a14 14 0 0 1 14 14v22H520z"/>
            <rect class="line" x="540" y="506" width="150" height="8" rx="4"/>
            <rect class="line" x="540" y="530" width="100" height="8" rx="4"/>
            <circle class="pin" cx="740" cy="480" r="5"/>
          </g>
          <g>
            <rect class="node" x="860" y="220" width="220" height="190" rx="14"/>
            <path class="head-a" d="M860 234a14 14 0 0 1 14-14h192a14 14 0 0 1 14 14v22H860z"/>
            <rect class="line" x="880" y="276" width="170" height="110" rx="10"/>
            <circle class="pin" cx="860" cy="260" r="5"/><circle class="pin" cx="860" cy="300" r="5"/>
          </g>
        </svg>
        <div class="badge">Waiting for ComfyUI…</div>
      </div>
    </div>
  </main>

<script>
  // The server tells the page where ComfyUI is (GET api/state). Until it is up, the frame shows a placeholder.
  var frame = document.getElementById("frame");
  var badge = document.querySelector(".badge");

  function mount(url) {
    var f = document.createElement("iframe");
    f.src = url;
    f.title = "ComfyUI";
    f.allow = "clipboard-read; clipboard-write; fullscreen";
    f.onload = function () {
      var p = document.getElementById("placeholder");
      if (p) p.remove();
    };
    frame.appendChild(f);
  }

  function tick() {
    fetch("api/state", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (s) {
        if (s.comfy_url && s.comfy_ready) { mount(s.comfy_url); return; }
        badge.textContent = s.demo ? "Demo mode: ComfyUI is not running"
          : s.comfy_url ? "Starting ComfyUI\u2026" : "Waiting for ComfyUI\u2026";
        setTimeout(tick, 3000);
      })
      .catch(function () {
        badge.textContent = "Connection lost, retrying\u2026";
        setTimeout(tick, 3000);
      });
  }
  tick();

  document.getElementById("theme").onclick = function () {
    var root = document.documentElement;
    var cur = root.getAttribute("data-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = cur === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("cc-theme", next); } catch (e) {}
  };
</script>
</body>
</html>
